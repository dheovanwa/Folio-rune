[package]
name = "folio"
version = "0.1.0"
edition = "2024"
description = "A distraction-free URL article reader, rebuilt with Rune"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f", features = ["tooling"] }
dom_smoothie = "0.19"
dom_query = "0.29"
html-escape = "0.2"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"

[[bin]]
name = "folio"
path = "src/main.rs"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "52f858284387401dad7f7e12574ce7764f32889f" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
